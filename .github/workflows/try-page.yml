name: Try Prism page and the canonical frame

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: try-page-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: headless browser acceptance
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Check out the exact event revision
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
          persist-credentials: false
      # CI development feedback reuses this existing PR job; it is not full acceptance.
      - name: Check PR merge-candidate diff before browser tests
        if: github.event_name == 'pull_request'
        shell: bash
        run: git diff --check HEAD^1 HEAD
      - name: Reject forged or malformed PR stage events
        if: github.event_name == 'pull_request'
        run: python3 -I -m unittest discover -s scripts/ci -p 'test_pr_stage.py'
      - name: Report development or review candidate (NOT MERGE ACCEPTANCE)
        if: github.event_name == 'pull_request'
        env:
          REPOSITORY: ${{ github.repository }}
        run: |
          python3 -I scripts/ci/pr_stage.py --event "$GITHUB_EVENT_PATH" \
            --repo "$REPOSITORY" --summary "$GITHUB_STEP_SUMMARY"
      - name: Install Node 22
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: package-lock.json
      - name: Verify Pages identity gates against planted wrong metadata
        run: python3 -I -m unittest discover -s scripts/ci -p 'test_pages_identity.py'
      - name: Refuse stale Pages repository identity before costly build work
        shell: bash
        run: |
          node -e '
            const { readFileSync } = require("node:fs");
            const actual = JSON.parse(readFileSync("site/app.json", "utf8")).repository;
            const expected = `https://github.com/${process.env.GITHUB_REPOSITORY}`;
            if (typeof actual !== "string" || actual.toLowerCase() !== expected.toLowerCase()) {
              console.error(`site/app.json repository mismatch: ${actual} != ${expected}`);
              process.exit(1);
            }
          '
      - name: Check release-platform manifest and negative controls
        run: python3 -I -m unittest discover -s scripts/release -p 'test_platforms.py'
      - name: Install the test runner from the checked-in lockfile
        run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Install Chromium
        run: npx playwright install --with-deps chromium
      - name: Reject invalid browser acceptance results
        run: node --test bootstrap/acceptance-result.test.mjs
      - name: Reject failed refreshed census attempts
        shell: bash
        run: bash scripts/ci/test-land-register.sh
      - name: Check bounded model source citations and planted overdepth
        run: python3 -I -m unittest discover -s scripts/self-model -p "test_bounded_sources.py"
      - name: Reject installation checks after failed upstream workflow
        run: python3 -I -m unittest discover -s scripts/ci -p 'test_install_upstream_gate.py'
      - name: Verify exact tag acceptance refusals
        run: python3 -I -m unittest discover -s scripts/release -p 'test_qualify_tag.py'
      - name: Verify, answer add 20 22 and replay 22/22
        run: npm run test:try
      - name: Prism accounts - every signature check refuses, and the passkey flow signs in
        run: npm run test:identity
      - name: Build the canonical frame every Prism app loads
        run: node frame/publish.mjs "$RUNNER_TEMP/frame" "$GITHUB_SHA"
      - name: Build the sign-in page for id.uor.foundation, pinned by hash
        run: node identity/publish.mjs "$RUNNER_TEMP/identity" "$GITHUB_SHA"

  deploy:
    name: publish the try page and the canonical frame
    # Repositories made from this template have no Pages site for this page.
    if: github.repository == 'UOR-Foundation/template' && github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: verify
    runs-on: ubuntu-24.04
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Check out the exact event revision
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Install Node 22
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: 22
      # Every Prism app loads the frame from here at run time, so publishing
      # main's frame is how a frame change reaches every app: no app rebuilds.
      - name: Install the frame's minifier, the exact version package-lock.json pins
        run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Assemble the try page and the canonical frame
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/site"
          cp -r try/. "$RUNNER_TEMP/site/"
          node frame/publish.mjs "$RUNNER_TEMP/site/frame" "$GITHUB_SHA"
      - name: Configure Pages
        uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d
      - name: Upload the try page and the frame
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9
        with:
          path: ${{ runner.temp }}/site
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346
