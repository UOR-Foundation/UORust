name: Quality model regeneration evidence (temporary, #26)

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  bounded-model:
    # Deliberately narrow: no fork PR or unrelated branch executes the writer.
    if: github.event.pull_request.head.repo.full_name == 'afflom/UORust' && github.head_ref == 'fix/uorust-26-bounded-quality-provenance'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Checkout the precise PR head without credentials
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
          persist-credentials: false
      - name: Generate with the unmodified digest-pinned SDK
        run: scripts/ci/sdk.sh 'just self-model-write'
      - name: Capture generated proposal even when regeneration refuses
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          git diff --binary > quality-generated.patch
          git status --porcelain=v1 > quality-status.txt
          cp app/src/Quality.lex.tex quality-generated.lex.tex
          git rev-parse HEAD > quality-source-sha.txt
          sha256sum quality-generated.lex.tex > quality-generated.sha256
      - name: Retain the inert, reviewable proposal (no writeback)
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: quality-model-proposal
          path: |
            quality-generated.patch
            quality-status.txt
            quality-generated.lex.tex
            quality-source-sha.txt
            quality-generated.sha256
          if-no-files-found: error
          retention-days: 3
