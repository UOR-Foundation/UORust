# Keeps every generated file current on main. On each push to main it runs
# `just generate` (every writer the gate checks the output of) through the
# locked SDK and, when anything changed, pushes the result as one commit and
# dispatches the gate and the page for it. Nobody has to remember a writer:
# a push that forgot one is followed by the commit that runs it. Each hour it
# also re-pins the brand to uor.foundation's newest main (brand/foundation.lock),
# so the brand, design and context-of-use facets regenerate from it; a site
# change that breaks a WCAG contrast fails the writer and is not pinned. Every
# run re-decides the MIR path's translations (`uorust prove`) and publishes the
# lift's honesty report: how many functions lifted, and the residue by the MIR
# kind or obligation that stopped it.
#
# A branch of this repository gets the same writers only when a person
# dispatches this workflow on it (scripts/ci/generate-branch.sh): they run on
# the branch merged onto main, and what changed is pushed to the branch as
# that merge (first parent main), never to main or to a fork; the gate is
# dispatched on it, and the certified export too when `export` is given and
# the translator's uncertified functions outnumber main's. No push to a pull
# request starts it: these runs repeat every writer and every export whatever
# changed, so until each is an obligation keyed on its own inputs they are
# started on purpose, never by a push.
name: generate

on:
  push:
    branches: [main]
  # Hourly, so the brand follows uor.foundation without a push here.
  schedule:
    - cron: '41 * * * *'
  # A dispatch on a branch (a person's, or certified.yml's land): gh workflow
  # run generate.yml --ref <branch>, with -f export=true to also dispatch the
  # certified export when the ratchet grows; the merge takes main's side of
  # the generated files.
  workflow_dispatch:
    inputs:
      export:
        description: On a branch other than main, also dispatch the certified export when the ratchet grows.
        type: boolean
        default: false

permissions:
  contents: read

# One run at a time, never cancelled: a run in progress finishes and pushes,
# and only the newest of the pushes that land meanwhile runs next (GitHub
# keeps one pending run per group). Cancelling in progress meant a steady
# stream of pushes starved every run and nothing was ever regenerated.
# A pull request's branch is a queue of its own (its pushes and the runs
# dispatched on it), so it neither waits for main's nor replaces them. A
# pull request the job skips (from a fork, into another base, Dependabot's)
# gets a group of its own run, so it never replaces a branch's pending run.
concurrency:
  group: >-
    ${{ github.ref == 'refs/heads/main' && 'generate' ||
    (github.event_name == 'pull_request' &&
    (github.event.pull_request.head.repo.full_name != github.repository ||
    github.event.pull_request.base.ref != 'main' ||
    github.event.pull_request.user.login == 'dependabot[bot]')) &&
    format('generate-skipped-{0}', github.run_id) ||
    format('generate-branch-{0}', github.head_ref || github.ref_name) }}
  cancel-in-progress: false

jobs:
  generate:
    name: run every writer and push what changed
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    # Main; a pull request into main from a branch of this repository that a
    # person (not Dependabot, whose token is read-only) opened; a dispatch.
    if: >-
      github.event_name != 'pull_request' ||
      (github.event.pull_request.head.repo.full_name == github.repository &&
      github.event.pull_request.base.ref == 'main' &&
      github.event.pull_request.user.login != 'dependabot[bot]')
    permissions:
      contents: write
      actions: write
    env:
      # What the writers write, which both steps commit.
      WRITTEN: CONFORMANCE.md README.md app model brand crates xtask frontier.toml lift-verdicts.toml
    steps:
      - name: Check out the exact event revision
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
          persist-credentials: false
      # The brand authority, every writer through the locked SDK, and the
      # push: when main moved meanwhile, the writers run again on the new
      # main in this job (decided verdicts carry over), so what lands is
      # always the output of the tree it lands on and no push is lost.
      - name: Run every writer on main as it is, and push what changed
        if: github.ref == 'refs/heads/main'
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          GENERATE_BUDGET: '4200'
        run: |
          scripts/ci/generate-loop.sh "Regenerate the generated files" \
            "$WRITTEN" \
            bootstrap.yml pages.yml certified.yml
      # Never main: the scripts refuse BRANCH main, and push only to it. A
      # dispatch on a tag runs neither step.
      - name: Run every writer on the branch merged onto main, and push the merge to the branch
        if: github.ref != 'refs/heads/main' && (github.event_name == 'pull_request' || startsWith(github.ref, 'refs/heads/'))
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          BRANCH: ${{ github.head_ref || github.ref_name }}
          EVENT: ${{ github.event_name }}
          EXPORT: ${{ inputs.export == true }}
        run: |
          scripts/ci/generate-branch.sh "Regenerate the generated files" \
            "$WRITTEN"
      - name: Publish the lift's honesty report
        if: always()
        shell: bash
        run: |
          {
            echo '## Lift honesty report'
            echo
            echo '```'
            sed -n '/^# Honesty report/,/^$/p' frontier.toml | sed 's/^# \{0,1\}//'
            echo '```'
          } >>"$GITHUB_STEP_SUMMARY"
