# Temporary, read-only regeneration evidence for PR #3; remove before merge.
# The template-owned bootstrap workflow remains unchanged.
name: temporary frontier regeneration evidence
on:
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/refresh-frontier-once.yml'
permissions:
  contents: read
jobs:
  regenerate:
    if: ${{ github.event.pull_request.number == 3 && github.event.pull_request.head.repo.full_name == 'afflom/UORust' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - name: Checkout exact proposed merge revision
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Regenerate and report only the frontier diff
        shell: bash
        run: |
          set -euo pipefail
          echo "FRONTIER_MERGE_HEAD=$(git rev-parse HEAD)"
          echo "FRONTIER_BASE_BLOB=$(git rev-parse HEAD:frontier.toml)"
          scripts/ci/sdk.sh 'just register'
          echo "FRONTIER_NEW_SHA256=$(sha256sum frontier.toml | cut -d' ' -f1)"
          echo "FRONTIER_NEW_BYTES=$(wc -c < frontier.toml)"
          git diff --check -- frontier.toml
          echo "FRONTIER_DIFF_START"
          git diff --no-ext-diff --unified=0 -- frontier.toml
          echo "FRONTIER_DIFF_END"
