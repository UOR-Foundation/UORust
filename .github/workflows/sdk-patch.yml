# Publishes the patched PrismPM SDK this project pins until a PrismPM release
# carries the fixes it needs (UOR-Foundation/PrismPM#612 and the LexLean
# PF-26 pin, PrismPM#672). The image is the pinned SDK candidate's own layers
# plus the `prismpm` and `lexlean` binaries built from one PrismPM revision
# (lexlean from that revision's vendored LexLean, so the two always agree on
# the compiler semantics) and the inventory that names them, assembled by
# sdk-patch/assemble.py; nothing else in the SDK changes. Run it from the Actions tab; the summary prints the
# immutable index reference to pin in prismpm.lock.
name: sdk-patch

on:
  workflow_dispatch:
    inputs:
      prismpm-revision:
        description: PrismPM commit to build prismpm and its vendored lexlean from.
        required: true
        default: 1eb78eaa771160cce28a387d127f4a293622b277
      base-image:
        description: SDK candidate index the patched image extends.
        required: true
        default: ghcr.io/uor-foundation/prismpm-sdk-candidate@sha256:f9bb61a843ef4e42b6d22ee1cff5ca9d5c8d9ba2782d8da7e55008ae3f61bd16

permissions: {}

jobs:
  binary:
    name: prismpm + lexlean / ${{ matrix.arch }}
    strategy:
      fail-fast: true
      matrix:
        include:
          - {runner: ubuntu-24.04, arch: amd64}
          - {runner: ubuntu-24.04-arm, arch: arm64}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 60
    permissions:
      contents: read
    steps:
      - name: Check out this repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Build prismpm and lexlean at the exact revision
        env:
          REVISION: ${{ inputs.prismpm-revision }}
        shell: bash
        run: |
          set -euo pipefail
          [[ $REVISION =~ ^[0-9a-f]{40}$ ]]
          # Outside this checkout, so cargo never takes UORust's workspace for
          # the vendored LexLean's.
          git init -q ../prismpm
          git -C ../prismpm fetch -q --depth 1 https://github.com/UOR-Foundation/PrismPM.git "$REVISION"
          git -C ../prismpm checkout -q FETCH_HEAD
          cd ../prismpm
          cargo build --locked --release --package prismpm
          cargo build --locked --release --manifest-path vendor/lexlean/Cargo.toml --bin lexlean --target-dir target/lexlean
      - name: Assemble the patched layers
        env:
          BASE: ${{ inputs.base-image }}
          ARCH: ${{ matrix.arch }}
        shell: bash
        run: >-
          python3 sdk-patch/assemble.py layer "$ARCH" "$BASE" "out-$ARCH"
          prismpm=../prismpm/target/release/prismpm
          lexlean=../prismpm/target/lexlean/release/lexlean
      - name: Keep the layers for the publish job
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: sdk-patch-${{ matrix.arch }}
          path: out-${{ matrix.arch }}
          retention-days: 7

  publish:
    name: publish the patched SDK index
    needs: binary
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    permissions:
      contents: read
      packages: write
    steps:
      - name: Check out this repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Fetch both architectures
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
        with:
          pattern: sdk-patch-*
      - name: Push layers, manifests and the index
        env:
          BASE: ${{ inputs.base-image }}
          REVISION: ${{ inputs.prismpm-revision }}
          GHCR_USER: ${{ github.actor }}
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          OWNER: ${{ github.repository_owner }}
        shell: bash
        run: |
          set -euo pipefail
          owner=$(tr '[:upper:]' '[:lower:]' <<< "$OWNER")
          ref=$(python3 sdk-patch/assemble.py index "ghcr.io/$owner/prismpm-sdk-patched:sha-$REVISION" "$BASE" sdk-patch-amd64 sdk-patch-arm64)
          printf 'Patched SDK: `%s`\n' "$ref" | tee -a "$GITHUB_STEP_SUMMARY"
