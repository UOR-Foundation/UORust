# The ident_case register (written by `uorust crate ident_case@1.0.1`; do not edit): every body of
# ident_case's MIR at ident_case 1.0.1, translated by the MIR path with each
# type parameter bound to `u32`, by module. A translated body lowers
# to LexLean; the residue stops at the causes listed last. Rows, by κ, are
# in each module's own file, and none recorded translated may regress.

toolchain = "1.97.1"
instantiation = "u32"
bodies = 8
translated = 1
residue = 7

[module.crate]
bodies = 8
translated = 1
residue = 7

[embedding]
bodies = 8
embedded = 8
evaluable = 8
blocked = 0

[[cause]]
cause = "mir::Instantiation: u32 for a parameter bounded by AsRef"
bodies = 2

[[cause]]
cause = "mir::Rvalue::Aggregate: of Nat"
bodies = 2

[[cause]]
cause = "mir::TerminatorKind::Call: discriminant_value"
bodies = 1

[[cause]]
cause = "mir::Ty: RenameRule"
bodies = 1

[[cause]]
cause = "mir::Ty: std::fmt::Error"
bodies = 1
