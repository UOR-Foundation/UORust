statement = "A lifted function never turns unlifted: every function of product code has exactly one row of the lift register, keyed by the κ of its crate path and normalized tokens and typed as lifted, residue (with its cause), foreign (naming the registry crate of its type) or effect (naming the operating-system effect), a lifted row may carry a divergence saying where its definition parts from the Rust function (such as a Unicode table LexLean does not bind) and no other row carries one, and a projection that decides a κ the committed register records as lifted exactly as diverging, or a κ it records as lifted (the fixture's frontier.toml, this workspace's frontier.toml) as anything else is refused; `uorust admit --parent` holds a candidate register against its parent's (read by its rows, whichever tool wrote it) by that law and by one more per function: a κ the parent records as stopped by a construct (its cause and detail) and the candidate counts under another construct is refused unless the candidate shows that construct gone for that function (every row that is not lifted records every construct its signature's types state, and the parent's records the construct while the candidate's does not; a call construct names its callee by its crate path, and that callee was not lifted and is; an effect is reached no more), whether or not the construct still stops another function, so a cause rises only by new questions or by functions whose blocker is shown gone; every function has a row of its own path, the inline modules around it included; each [[construct]] row of a projection's frontier.toml whose cause is a type outside the lift carries the sites (file and line) of the declarations its chain means, each name read where the chain writes it (by the use bindings, the child modules and the macro invocations of that module, or as the name the projection gave the type), and lists apart the names it cannot place; a changed function is a new question, and the unlifted rows are the distance to the requirement that every function lifts, reported as an open claim and never a ceiling"

